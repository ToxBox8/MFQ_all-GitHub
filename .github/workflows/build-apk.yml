name: Tests y APK

on:
  push:
    paths: ["app/**", ".github/workflows/build-apk.yml"]
  pull_request:
    paths: ["app/**"]
  workflow_dispatch:
  release:
    types: [published]

# Una compilación a la vez por rama: evita que dos ejecuciones publiquen la release a la vez
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # para adjuntar el APK a las releases

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "flet==1.1.3" pytest
      - run: python -m pytest -q

  apk:
    needs: test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    env:
      PYTHONUTF8: "1"
      FLET_CLI_NO_RICH_OUTPUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Instalar Flet CLI
        run: pip install "flet[all]==1.1.3"
      - name: Compilar APK
        run: flet build apk --yes --build-number ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: MFQ_All-apk
          path: app/build/apk/*.apk
          if-no-files-found: error
      - name: Publicar en la release «ultima-version»
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp "$(ls build/apk/*.apk | head -n 1)" MFQ_All.apk
          NOTES="APK compilado automáticamente desde la rama ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}). Descarga MFQ_All.apk e instálalo en Android."
          if ! gh release view ultima-version > /dev/null 2>&1; then
            gh release create ultima-version --latest --target "$GITHUB_SHA" \
              --title "MFQ All · última versión" --notes "$NOTES"
          else
            gh release edit ultima-version --notes "$NOTES" --prerelease=false --latest
          fi
          gh release upload ultima-version MFQ_All.apk --clobber
      - name: Adjuntar a la release
        if: github.event_name == 'release'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ github.event.release.tag_name }}" build/apk/*.apk --clobber
